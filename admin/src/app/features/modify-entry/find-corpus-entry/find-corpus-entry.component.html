<nz-input-search class="search-bar" [nzEnterButton]="true" [nzLoading]="isLoading" (nzSearch)="search($event.value)">
  <input type="text" nz-input placeholder="pled per tschertgar" [value]="searchTerm" />
</nz-input-search>

@if (searchTerm) {
  <ul nz-list [nzDataSource]="examples" nzBordered>
    @for (item of examples; track item) {
      <li nz-list-item nzNoFlex class="example-item">
        <span [innerHTML]="item | highlighter:searchTerm:true"></span>
        <ul nz-list-item-actions>
          <nz-list-item-action>
            <a (click)="select(item)">tscherner</a>
          </nz-list-item-action>
        </ul>
      </li>
    }
  </ul>
}
